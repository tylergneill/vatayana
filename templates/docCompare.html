        <script>
        	function loadSimilarDocNav(queryDocId, otherDocId, side, attempt) {
                attempt = attempt || 1;
                var simNav = document.getElementById('sim-nav-' + side);
                if (!simNav || !queryDocId || !otherDocId) return;
                fetch('/api/similar_doc_links?doc_id=' + encodeURIComponent(queryDocId) + '&other_doc_id=' + encodeURIComponent(otherDocId))
                    .then(function(r) {
                        if (r.status === 503 && attempt < 4) {
                            setTimeout(function() { loadSimilarDocNav(queryDocId, otherDocId, side, attempt + 1); }, attempt * 1000);
                            return null;
                        }
                        return r.json();
                    })
                    .then(function(data) {
                        if (!data || !data.found) return;
                        simNav.dataset.rank = data.rank;
                        simNav.dataset.total = data.total;

                        // Update button form values
                        var prevBtn = document.getElementById('sim-prev-btn-' + side);
                        var nextBtn = document.getElementById('sim-next-btn-' + side);
                        if (prevBtn) {
                            var prevInput = prevBtn.closest('form').querySelector('input[name="doc_id_' + (side === 'left' ? '1' : '2') + '"]');
                            if (prevInput) prevInput.value = data.prev_doc_id || '';
                            prevBtn.title = 'More similar (#' + (data.prev_rank || '') + ' of ' + data.total + ')';
                            if (!data.prev_doc_id || data.rank === 1) {
                                prevBtn.disabled = true;
                                prevBtn.classList.add('disabled');
                            }
                        }
                        if (nextBtn) {
                            var nextInput = nextBtn.closest('form').querySelector('input[name="doc_id_' + (side === 'left' ? '1' : '2') + '"]');
                            if (nextInput) nextInput.value = data.next_doc_id || '';
                            nextBtn.title = 'Less similar (#' + (data.next_rank || '') + ' of ' + data.total + ')';
                            if (!data.next_doc_id || data.rank === data.total) {
                                nextBtn.disabled = true;
                                nextBtn.classList.add('disabled');
                            }
                        }

                        // Update rank text
                        var rankText = simNav.querySelector('.text-center small');
                        if (rankText) {
                            rankText.innerHTML = 'for <em>' + queryDocId + '</em>:<br>most similar #' + data.rank + ' of ' + data.total;
                        }

                        simNav.style.visibility = 'visible';
                    })
                    .catch(function(e) { console.error('sim-nav-' + side + ' error:', e); });
            }

         	window.onload = function() {

              // ─── DOCUMENT NAVIGATION: first/prev/next/last for left & right ─────────────────
			  ['left','right'].forEach(side => {
				const container = document.getElementById(`doc-compare-${side}`);
				if (!container) return;

				const current = container.dataset.current;
				const first   = container.dataset.first;
				const last    = container.dataset.last;

				['first','prev','next','last'].forEach(type => {
				  const btn = document.getElementById(`btn-${type}-${side}`);
				  if (!btn) return;

				  // hide first & prev at the start
				  if ((type === 'first' || type === 'prev') && current === first) {
					btn.disabled = true;
					btn.classList.add('disabled');
				  }
				  // hide next & last at the end
				  if ((type === 'next' || type === 'last') && current === last) {
					btn.disabled = true;
					btn.classList.add('disabled');
				  }
				});
			  });

            }

			var abbrv2docs = {};
			var abbrev2title = {};
			var section_labels = {};
			var doc1 = "{{ doc_id_1 }}";
			var doc2 = "{{ doc_id_2 }}";

			var initial_values = [
				{
					text_abbreviation: "{{ text_abbreviation_1 }}",
					local_doc_id: "{{ local_doc_id_1 }}",
					textSelId: "text_abbreviation_input_1",
					docSelId: "local_doc_id_input_1"
				},
				{
					text_abbreviation: "{{ text_abbreviation_2 }}",
					local_doc_id: "{{ local_doc_id_2 }}",
					textSelId: "text_abbreviation_input_2",
					docSelId: "local_doc_id_input_2"
				}
			];

			function setupSelectorPair(textSelId, docSelId, initialTextAbbr, initialDocId) {
				var textSel = document.getElementById(textSelId);
				var docSel = document.getElementById(docSelId);

				// Reset text abbreviation options
				textSel.length = 1;  // keep the dummy option
				for (var abbrev in abbrv2docs) {
					textSel.options[textSel.options.length] = new Option(abbrev + ' ' + abbrev2title[abbrev], abbrev);
				}

				// Set initial abbreviation
				textSel.value = initialTextAbbr;

				// Populate doc IDs for that abbreviation
				function populateDocIds(abbreviation) {
					docSel.length = 1;  // keep the dummy option
					for (var docId of abbrv2docs[abbreviation]) {
						var label = section_labels[abbreviation + '_' + docId] || '';
						docSel.options[docSel.options.length] = new Option(docId + ' ' + label, docId);
					}
				}

				// Initial population of doc IDs
				if (initialTextAbbr && abbrv2docs[initialTextAbbr]) {
					populateDocIds(initialTextAbbr);
					docSel.value = initialDocId;
				}

				// Wire up onchange for future changes
				textSel.onchange = function() {
					populateDocIds(this.value);
				};
			}

			// --- Fetch data from API, then apply to both pairs ---
			Promise.all([
				fetch('/api/abbrv2docs.json').then(function(r) { return r.json(); }),
				fetch('/api/abbrev2title.json').then(function(r) { return r.json(); }),
				fetch('/api/section_labels.json').then(function(r) { return r.json(); }),
			]).then(function(results) {
				abbrv2docs = results[0];
				abbrev2title = results[1];
				section_labels = results[2];
				for (var pair of initial_values) {
					setupSelectorPair(pair.textSelId, pair.docSelId, pair.text_abbreviation, pair.local_doc_id);
				}
				if (doc1 && doc2) {
					loadSimilarDocNav(doc2, doc1, 'left');
					loadSimilarDocNav(doc1, doc2, 'right');
				}
			});
        </script>
